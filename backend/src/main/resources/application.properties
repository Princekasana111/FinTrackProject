spring.application.name=fintrack

# ---------------------------------------------------------------------------
# DATABASE
# ---------------------------------------------------------------------------
# DEFAULT = H2 in-memory database, so you can run the app WITHOUT installing
# MySQL. Data resets on restart (great for learning/testing).
#
# To use MySQL instead, either:
#   (a) run via docker-compose (it sets the env vars below automatically), or
#   (b) uncomment the MySQL block and comment out the H2 block.
# ---------------------------------------------------------------------------

# ---- H2 (default) ----
spring.datasource.url=jdbc:h2:mem:fintrack;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- MySQL (uncomment to use a local MySQL install) ----
# spring.datasource.url=jdbc:mysql://localhost:3306/fintrack?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# JWT — the secret MUST be at least 32 chars for HS256. Change it in production
# and load it from an environment variable, never commit a real secret.
# ---------------------------------------------------------------------------
app.jwt.secret=fintrack-super-secret-key-change-me-please-1234567890
app.jwt.expiration-ms=86400000

server.port=8080
